<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UECFI Join Session</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #059669; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Join Session</h2>
        <input type="text" id="roomId" placeholder="Room ID">
        <input type="text" id="secret" placeholder="Secret Key">
        <button id="joinBtn">Join Live Service</button>
    </div>

    <video id="remoteVideo" autoplay playsinline style="width: 100%; max-width: 600px; display: none;"></video>

    <script>
        const socket = io("https://uecfi-signaling.onrender.com");
        let peer;

        document.getElementById('joinBtn').addEventListener('click', () => {
            const roomId = document.getElementById('roomId').value;
            const secret = document.getElementById('secret').value;

            socket.emit('join-room', { roomId, secret }, (response) => {
                if (response.status === 'success') {
                    startPeer(response.hostId, true);
                } else {
                    alert('Invalid ID or Secret');
                }
            });
        });

        function startPeer(hostId, initiator) {
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                peer = new SimplePeer({ initiator, stream, trickle: false });

                peer.on('signal', data => {
                    socket.emit('signal', { to: hostId, signal: data });
                });

                peer.on('stream', stream => {
                    const video = document.getElementById('remoteVideo');
                    video.srcObject = stream;
                    video.style.display = 'block';
                });

                socket.on('signal', ({ from, signal }) => {
                    peer.signal(signal);
                });
            });
        }
    </script>
</body>
</html>
