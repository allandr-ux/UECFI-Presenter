name: Build Desktop Apps (macOS Intel & Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13 # Last Intel-based macOS runner (macos-latest is Apple Silicon)
            platform: mac
            artifact_name: uecfi-presenter-macos-intel
          - os: windows-latest
            platform: windows
            artifact_name: uecfi-presenter-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Build macOS Intel app (DMG & ZIP)
        if: matrix.platform == 'mac'
        env:
          # Disable automatic code signing search when certificates are not configured
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64

      - name: Build Windows app (NSIS Installer & Portable)
        if: matrix.platform == 'windows'
        run: npx electron-builder --win

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach binaries to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
